  <main class="w-full max-w-2xl flex-1 flex flex-col justify-center items-center my-4">

      <div class="text-6xl animate-bounce">🎧</div>
      <h2 class="text-3xl font-bold text-indigo-900">Spelling Star Quest!</h2>
      <p class="text-gray-600 text-lg">Click below to unlock the voice and begin practicing.</p>
      <button onclick="startApp()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-2xl font-bold rounded-2xl shadow-lg transition">
        🔊 Turn On Sound & Start!
      </button>
    </div>

    <!-- Active Stage Screen (Words & Sentence) -->
    <div id="quizScreen" class="w-full bg-white rounded-3xl p-6 border-4 border-indigo-200 shadow-lg hidden space-y-5 text-center">
      
      <div class="flex justify-between items-center text-sm font-bold text-gray-400">
        <span id="progressIndicator">Word 1 of 5</span>
        <span id="streakCount" class="text-orange-500">🔥 Streak: 0</span>
      </div>

      <!-- Listen Controls -->
      <div class="flex flex-col sm:flex-row justify-center gap-3">
        <button onclick="sayCurrent(1.0)" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xl rounded-2xl shadow-md transition flex items-center justify-center space-x-2">
          <span id="btnSayLabel">🔊 Say Word</span>
        </button>
        <button onclick="sayCurrent(0.65)" class="py-4 px-6 bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold text-xl rounded-2xl shadow-md transition flex items-center justify-center space-x-2">
          <span>🐢 Slow</span>
        </button>
      </div>

      <!-- Input Display (Target word NEVER shown) -->
      <div class="py-4 px-3 bg-indigo-50/50 rounded-2xl border-2 border-dashed border-indigo-200 min-h-[90px] flex items-center justify-center">
        <span id="typedDisplay" class="text-3xl sm:text-4xl font-bold tracking-wider text-indigo-950 break-words">_ _ _</span>
      </div>

      <!-- On-Screen Keyboard -->
      <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-1.5 pt-2"></div>

      <!-- Actions Row -->
      <div class="flex gap-2">
        <button onclick="handleSpace()" id="btnSpace" class="hidden py-3 px-4 bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-800 font-bold rounded-xl transition">
          ␣ Space
        </button>
        <button onclick="handleBackspace()" class="flex-1 py-3 bg-red-100 hover:bg-red-200 active:scale-95 text-red-700 font-bold rounded-xl transition">
          ⌫ Delete
        </button>
        <button onclick="checkAnswer()" class="flex-2 py-3 px-6 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-lg rounded-xl shadow transition">
          Check Answer ✨
        </button>
      </div>

      <!-- Feedback -->
      <div id="feedbackMsg" class="min-h-[28px] text-base font-bold text-indigo-600"></div>
    </div>

    <!-- Win Screen -->
    <div id="winScreen" class="w-full bg-white rounded-3xl p-8 border-4 border-amber-300 shadow-xl hidden text-center space-y-4">
      <div class="text-7xl animate-bounce">🏆</div>

        Play Again 🔄
      </button>
    </div>

    // Direct Browser Speech Engine
    function speak(text, rate) {
      if (!rate) rate = 1.0;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utter = new SpeechSynthesisUtterance(text);
        utter.rate = rate;
        utter.lang = (lang === 'es') ? 'es-ES' : 'en-US';
        window.speechSynthesis.speak(utter);
      }
    }

    function sayCurrent(rate) {
      if (words[currentIdx]) speak(words[currentIdx], rate);
    }

    function saySentence(rate) {
      if (sentence) speak(sentence, rate);
    }

    function init() {
      loadSaved();
      buildKeyboard();
      loadWord();
    }

    function loadWord() {
      currentInput = '';
      document.getElementById('wordDisplay').innerText = '_ _ _';
      document.getElementById('progressIndicator').innerText = 'Word ' + (currentIdx + 1) + ' of ' + words.length;
      document.getElementById('feedback').innerText = '';
    }

    function buildKeyboard() {
      var kb = document.getElementById('keyboard');
      kb.innerHTML = '';
      var letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
      if (lang === 'es') letters.push('ñ');

      letters.forEach(function(l) {
        var b = document.createElement('button');
        b.className = 'key-btn';
        b.innerText = l.toUpperCase();
        b.onclick = function() {
          if (currentInput.length < 15) {
            currentInput += l;
            document.getElementById('wordDisplay').innerText = currentInput.toUpperCase();
          }
        };
        kb.appendChild(b);
      });
    }

    function handleDelete() {
      currentInput = currentInput.slice(0, -1);
      document.getElementById('wordDisplay').innerText = currentInput.length ? currentInput.toUpperCase() : '_ _ _';
    }

    function checkWord() {
      var target = (words[currentIdx] || '').trim().toLowerCase();
      var typed = currentInput.trim().toLowerCase();

      if (typed === target) {
        playBeep(true);
        score += 10;
        streak += 1;
        updateStats();
        document.getElementById('feedback').style.color = '#10b981';
        document.getElementById('feedback').innerText = '🎉 Correct! +10 Stars!';

        currentIdx++;
        setTimeout(function() {
          if (currentIdx < words.length) {
            loadWord();
            sayCurrent(1.0);
          } else {
            showSentenceStage();
          }
        }, 1000);
      } else {
        playBeep(false);
        streak = 0;
        updateStats();
        document.getElementById('feedback').style.color = '#d97706';
        document.getElementById('feedback').innerText = 'Try again! Listen carefully:';
        sayCurrent(0.65);
      }
    }

    function showSentenceStage() {
      document.getElementById('wordScreen').classList.add('hidden');
      document.getElementById('sentenceScreen').classList.remove('hidden');
      document.getElementById('stageBadge').innerText = 'Sentence Level';
      document.getElementById('stageBadge').style.background = '#f3e8ff';
      document.getElementById('stageBadge').style.color = '#6b21a8';
      saySentence(1.0);
    }

    function clean(str) {
      return (str || '').toLowerCase().replace(/[^a-záéíóúñ0-9 ]/g, '').replace(/\s+/g, ' ').trim();
    }

    function checkSentence() {
      var typed = clean(document.getElementById('sentenceTyped').value);
      var target = clean(sentence);

      if (typed === target) {
        playBeep(true);
        score += 25;
        updateStats();
        document.getElementById('sentenceScreen').classList.add('hidden');
        document.getElementById('winScreen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = score;
        speak(lang === 'es' ? '¡Excelente trabajo!' : 'Great job! You finished!');
      } else {
        playBeep(false);
        document.getElementById('sentenceFeedback').style.color = '#d97706';
        document.getElementById('sentenceFeedback').innerText = 'Almost! Listen once more:';
        saySentence(0.65);
      }
    }

    function updateStats() {
      document.getElementById('starScore').innerText = score;
      document.getElementById('streakIndicator').innerText = '🔥 Streak: ' + streak;
    }

    function restartAll() {
      currentIdx = 0;
      score = 0;
      streak = 0;
      updateStats();
      document.getElementById('winScreen').classList.add('hidden');
      document.getElementById('sentenceScreen').classList.add('hidden');
      document.getElementById('wordScreen').classList.remove('hidden');
      document.getElementById('stageBadge').innerText = 'Words Level';
      document.getElementById('stageBadge').style.background = '#e0e7ff';
      document.getElementById('stageBadge').style.color = '#4338ca';
      loadWord();
    }

    window.addEventListener('keydown', function(e) {
      if (!document.getElementById('wordScreen').classList.contains('hidden')) {
        if (e.key === 'Enter') checkWord();
        else if (e.key === 'Backspace') handleDelete();
        else if (/^[a-zA-ZñÑ]$/.test(e.key)) {
          if (currentInput.length < 15) {
            currentInput += e.key.toLowerCase();
            document.getElementById('wordDisplay').innerText = currentInput.toUpperCase();
          }
        }
      }
    });

    // Parent Settings Modal Functions
    function openSettings() {
      document.getElementById('inputWords').value = words.join(', ');
      document.getElementById('inputSentence').value = sentence;
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function setLang(l) {
      lang = l;
      document.getElementById('langBadge').innerText = l.toUpperCase();
      document.getElementById('btnEn').style.background = (l === 'en') ? '#e0e7ff' : 'white';
      document.getElementById('btnEn').style.borderColor = (l === 'en') ? '#4f46e5' : '#cbd5e1';
      document.getElementById('btnEs').style.background = (l === 'es') ? '#e0e7ff' : 'white';
      document.getElementById('btnEs').style.borderColor = (l === 'es') ? '#4f46e5' : '#cbd5e1';
      buildKeyboard();
    }

    function saveSettings() {
      var raw = document.getElementById('inputWords').value;
      var arr = raw.split(',').map(function(w) { return w.trim(); }).filter(function(w) { return w.length > 0; });
      if (arr.length > 0) words = arr;
      sentence = document.getElementById('inputSentence').value.trim();

      localStorage.setItem('sq_words', JSON.stringify(words));
      localStorage.setItem('sq_sentence', sentence);
      localStorage.setItem('sq_lang', lang);

      closeSettings();
      restartAll();
    }

    function loadSaved() {
      var w = localStorage.getItem('sq_words');
      var s = localStorage.getItem('sq_sentence');
      var l = localStorage.getItem('sq_lang');
      if (w) words = JSON.parse(w);
      if (s) sentence = s;
      if (l) setLang(l);
    }

    function testVoice() {
      playBeep(true);
      speak(lang === 'es' ? 'Sonido funcionando' : 'Sound is working');
    }

    init();
  </script>
</body>
</html>
