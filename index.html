<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Star Quest ⭐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .key-btn { touch-action: manipulation; }
  </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col items-center justify-between p-4 select-none">

  <!-- Header / Controls -->
  <header class="w-full max-w-2xl flex justify-between items-center bg-white px-5 py-3 rounded-3xl shadow-sm border-2 border-indigo-100">
    <div class="flex items-center space-x-2">
      <span class="text-3xl">⭐</span>
      <span id="starScore" class="text-2xl font-bold text-amber-500">0</span>
      <span class="text-sm text-gray-500 font-semibold ml-1">Stars</span>
    </div>
    <div class="flex items-center space-x-3">
      <span id="langPill" class="px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full">EN</span>
      <button onclick="openSettings()" class="p-2 text-gray-400 hover:text-indigo-600 transition">⚙️</button>
    </div>
  </header>

  <!-- Main Game Stage -->
  <main class="w-full max-w-2xl flex-1 flex flex-col justify-center items-center my-4">
    
    <!-- Audio Start Overlay -->
    <div id="startOverlay" class="w-full bg-white rounded-3xl p-8 border-4 border-indigo-200 shadow-xl text-center space-y-5">
      <div class="text-6xl animate-bounce">🎧</div>
      <h2 class="text-3xl font-bold text-indigo-900">Spelling Star Quest!</h2>
      <p class="text-gray-600 text-lg">Click the button below to turn on sound and start the quiz.</p>
      <button onclick="startAppWithAudio()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-2xl font-bold rounded-2xl shadow-lg transition">
        🔊 Turn On Sound & Start!
      </button>
    </div>

    <!-- Active Word Screen -->
    <div id="quizScreen" class="w-full bg-white rounded-3xl p-6 border-4 border-indigo-200 shadow-lg hidden space-y-6 text-center">
      
      <div class="flex justify-between items-center text-sm font-bold text-gray-400">
        <span id="wordProgress">Word 1 of 5</span>
        <span id="streakCount" class="text-orange-500">🔥 Streak: 0</span>
      </div>

      <!-- Listen Controls -->
      <div class="flex flex-col sm:flex-row justify-center gap-3">
        <button onclick="sayCurrentWord(1.0)" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xl rounded-2xl shadow-md transition flex items-center justify-center space-x-2">
          <span>🔊 Say Word</span>
        </button>
        <button onclick="sayCurrentWord(0.65)" class="py-4 px-6 bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold text-xl rounded-2xl shadow-md transition flex items-center justify-center space-x-2">
          <span>🐢 Slow</span>
        </button>
      </div>

      <!-- Word Display / Input Blank -->
      <div class="py-4 bg-indigo-50/50 rounded-2xl border-2 border-dashed border-indigo-200 min-h-[90px] flex items-center justify-center">
        <span id="typedDisplay" class="text-4xl sm:text-5xl font-bold tracking-widest text-indigo-950">_ _ _</span>
      </div>

      <!-- On-Screen Keyboard -->
      <div id="keyboard" class="grid grid-cols-7 sm:grid-cols-9 gap-1.5 pt-2"></div>

      <!-- Action Row -->
      <div class="flex gap-2">
        <button onclick="handleBackspace()" class="w-1/3 py-3 bg-red-100 hover:bg-red-200 active:scale-95 text-red-700 font-bold rounded-xl transition">
          ⌫ Delete
        </button>
        <button onclick="checkAnswer()" class="w-2/3 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-lg rounded-xl shadow transition">
          Check Word ✨
        </button>
      </div>

      <!-- Hint Feedback Banner -->
      <div id="feedbackMsg" class="min-h-[28px] text-base font-bold text-indigo-600"></div>
    </div>

    <!-- Completion Screen -->
    <div id="winScreen" class="w-full bg-white rounded-3xl p-8 border-4 border-amber-300 shadow-xl hidden text-center space-y-4">
      <div class="text-7xl animate-bounce">🏆</div>
      <h2 class="text-3xl font-bold text-indigo-900">You Finished All Words!</h2>
      <p class="text-xl text-gray-600">You earned <span id="finalScore" class="font-bold text-amber-500">0</span> Stars!</p>
      <button onclick="restartQuiz()" class="py-3 px-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xl rounded-2xl shadow-lg transition">
        Play Again 🔄
      </button>
    </div>
  </main>

  <!-- Parent Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl border-2 border-indigo-100 space-y-4">
      <h3 class="text-2xl font-bold text-indigo-950">⚙️ Weekly Word Setup</h3>
      
      <div>
        <label class="text-xs font-bold text-gray-400 block mb-1">LANGUAGE</label>
        <div class="grid grid-cols-2 gap-2">
          <button id="btnLangEn" onclick="setLang('en')" class="py-2 rounded-xl font-bold border-2 border-indigo-600 bg-indigo-50 text-indigo-700">English</button>
          <button id="btnLangEs" onclick="setLang('es')" class="py-2 rounded-xl font-bold border-2 border-gray-200 text-gray-600">Español</button>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-400 block mb-1">WEEKLY WORDS (separated by commas)</label>
        <textarea id="wordInput" rows="3" class="w-full p-3 rounded-xl border-2 border-indigo-100 font-semibold focus:outline-indigo-500 text-sm" placeholder="cat, ship, jump, like, play"></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="testVoiceDiagnostics()" class="w-1/2 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm">
          🔊 Test Audio
        </button>
        <button onclick="saveAndCloseSettings()" class="w-1/2 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow">
          Save & Start
        </button>
      </div>
    </div>
  </div>

  <script>
    // State
    let words = ['cat', 'ship', 'jump', 'play', 'like'];
    let currentIdx = 0;
    let currentInput = '';
    let score = 0;
    let streak = 0;
    let currentLang = 'en';
    let audioCtx = null;
    let availableVoices = [];

    // Audio Context unlocker
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Preload system voices
    function populateVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
      populateVoices();
    }

    // Play a friendly synth chime (always works without external downloads)
    function playBeep(success = true) {
      initAudioContext();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      if (success) {
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else {
        osc.frequency.setValueAtTime(220, now); // A3
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // Reliable Voice Speaker (With Fallback)
    function speakText(text, rate = 1.0) {
      initAudioContext();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // clear previous stuck speech

        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = rate;
        utter.lang = currentLang === 'es' ? 'es-ES' : 'en-US';

        // Select exact language voice if available
        if (availableVoices.length > 0) {
          const match = availableVoices.find(v => v.lang.startsWith(currentLang));
          if (match) utter.voice = match;
        }

        let hasSpoken = false;
        utter.onstart = () => { hasSpoken = true; };

        window.speechSynthesis.speak(utter);

        // Fallback check: if speech synthesis is blocked, use audio endpoint
        setTimeout(() => {
          if (!hasSpoken && !window.speechSynthesis.speaking) {
            playAudioFallback(text);
          }
        }, 350);
      } else {
        playAudioFallback(text);
      }
    }

    function playAudioFallback(text) {
      const langParam = currentLang === 'es' ? 'es' : 'en';
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${langParam}&client=tw-ob&q=${encodeURIComponent(text)}`;
      const audio = new Audio(url);
      audio.play().catch(e => console.log('Audio fallback failed:', e));
    }

    function startAppWithAudio() {
      initAudioContext();
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      loadSavedConfig();
      buildKeyboard();
      loadWord();
      playBeep(true);
      setTimeout(() => sayCurrentWord(), 400);
    }

    function sayCurrentWord(rate = 1.0) {
      const target = words[currentIdx];
      if (target) speakText(target, rate);
    }

    function loadWord() {
      currentInput = '';
      updateDisplay();
      document.getElementById('wordProgress').innerText = `Word ${currentIdx + 1} of ${words.length}`;
      document.getElementById('feedbackMsg').innerText = '';
    }

    function buildKeyboard() {
      const kb = document.getElementById('keyboard');
      kb.innerHTML = '';
      const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
      if (currentLang === 'es') letters.push('ñ');

      letters.forEach(letter => {
        const btn = document.createElement('button');
        btn.innerText = letter.toUpperCase();
        btn.className = "key-btn py-3 sm:py-3.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-900 font-bold rounded-xl text-lg shadow-sm border border-indigo-100 transition";
        btn.onclick = () => handleKey(letter);
        kb.appendChild(btn);
      });
    }

    function handleKey(letter) {
      initAudioContext();
      if (currentInput.length < 15) {
        currentInput += letter;
        updateDisplay();
      }
    }

    function handleBackspace() {
      initAudioContext();
      currentInput = currentInput.slice(0, -1);
      updateDisplay();
    }

    function updateDisplay() {
      const display = document.getElementById('typedDisplay');
      display.innerText = currentInput.length === 0 ? '_ _ _' : currentInput.toUpperCase();
    }

    function checkAnswer() {
      const target = words[currentIdx].trim().toLowerCase();
      const entered = currentInput.trim().toLowerCase();

      if (entered === target) {
        // Correct
        playBeep(true);
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        score += 10;
        streak += 1;
        document.getElementById('starScore').innerText = score;
        document.getElementById('streakCount').innerText = `🔥 Streak: ${streak}`;
        document.getElementById('feedbackMsg').innerText = "🎉 Super Star! Correct!";
        document.getElementById('feedbackMsg').className = "min-h-[28px] text-base font-bold text-emerald-600";

        currentIdx++;
        setTimeout(() => {
          if (currentIdx < words.length) {
            loadWord();
            sayCurrentWord();
          } else {
            showWinScreen();
          }
        }, 1200);
      } else {
        // Incorrect
        playBeep(false);
        streak = 0;
        document.getElementById('streakCount').innerText = `🔥 Streak: 0`;
        document.getElementById('feedbackMsg').innerText = "Try again! Listen to the sounds carefully.";
        document.getElementById('feedbackMsg').className = "min-h-[28px] text-base font-bold text-amber-600";
        sayCurrentWord(0.7);
      }
    }

    function showWinScreen() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('winScreen').classList.remove('hidden');
      document.getElementById('finalScore').innerText = score;
      confetti({ particleCount: 120, spread: 80 });
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      streak = 0;
      document.getElementById('starScore').innerText = '0';
      document.getElementById('streakCount').innerText = '🔥 Streak: 0';
      document.getElementById('winScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      loadWord();
      sayCurrentWord();
    }

    // Physical Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('quizScreen').classList.contains('hidden')) return;
      if (e.key === 'Enter') checkAnswer();
      else if (e.key === 'Backspace') handleBackspace();
      else if (/^[a-zA-ZñÑ]$/.test(e.key)) handleKey(e.key.toLowerCase());
    });

    // Parent Settings
    function openSettings() {
      document.getElementById('wordInput').value = words.join(', ');
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('settingsModal').classList.add('flex');
    }

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('langPill').innerText = lang.toUpperCase();
      document.getElementById('btnLangEn').className = lang === 'en' ? 'py-2 rounded-xl font-bold border-2 border-indigo-600 bg-indigo-50 text-indigo-700' : 'py-2 rounded-xl font-bold border-2 border-gray-200 text-gray-600';
      document.getElementById('btnLangEs').className = lang === 'es' ? 'py-2 rounded-xl font-bold border-2 border-indigo-600 bg-indigo-50 text-indigo-700' : 'py-2 rounded-xl font-bold border-2 border-gray-200 text-gray-600';
      buildKeyboard();
    }

    function saveAndCloseSettings() {
      const raw = document.getElementById('wordInput').value;
      const parsed = raw.split(',').map(w => w.trim()).filter(w => w.length > 0);
      if (parsed.length > 0) words = parsed;
      localStorage.setItem('spelling_words', JSON.stringify(words));
      localStorage.setItem('spelling_lang', currentLang);
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
      restartQuiz();
    }

    function loadSavedConfig() {
      const saved = localStorage.getItem('spelling_words');
      const savedLang = localStorage.getItem('spelling_lang');
      if (saved) words = JSON.parse(saved);
      if (savedLang) setLang(savedLang);
    }

    function testVoiceDiagnostics() {
      playBeep(true);
      speakText(currentLang === 'es' ? 'prueba de sonido' : 'sound test working');
    }
  </script>
</body>
</html>
